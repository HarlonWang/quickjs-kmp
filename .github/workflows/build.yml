name: Build

on:
  pull_request:
  push:
    branches: [main]

# 原生链路需要 Xcode（iOS）、NDK + CMake（Android），只有 macOS runner 能一次跑全
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Install NDK
        run: |
          NDK_VERSION=$(grep '^android-ndk' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Android host test 用宿主编译的 JNI 库走真实 JNI 路径；设备特有差异靠本地模拟器兜底（docs/decisions.md）
      - name: Build and test
        run: >
          ./gradlew
          :library:nativeShimTest
          :library:hostToolsTest
          :library:macosArm64Test
          :library:testAndroidHostTest
          :library:compileKotlinIosArm64
          :library:compileKotlinIosSimulatorArm64
          :library:assembleAndroidMain
          :library:apiCheck

      # 16 KB 页面设备与 Google Play 的要求；链接参数见 native/CMakeLists.txt
      - name: Check Android 16 KB page alignment
        run: |
          READELF=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -n 1)
          shopt -s nullglob
          libs=(library/build/native/android/*/lib/*.so)
          [ ${#libs[@]} -eq 3 ] || { echo "expected 3 Android .so, found ${#libs[@]}"; exit 1; }
          status=0
          for so in "${libs[@]}"; do
            align=$("$READELF" -lW "$so" | awk '$1 == "LOAD" { print $NF }' | sort -u)
            echo "$so: $align"
            [ -n "$align" ] || status=1
            for a in $align; do
              [ $((a)) -ge 16384 ] || status=1
            done
          done
          exit $status

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            library/build/test-results/
          if-no-files-found: ignore

  qjsc:
    uses: ./.github/workflows/qjsc.yml
